<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel ISRM Platform</title>
    <script>
   
      (function () {
        try {
          var TEMA_GUARDADO = window.localStorage.getItem("sentinel-theme");
          var prefiereOscuro =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var esOscuro = TEMA_GUARDADO === "dark" || (!TEMA_GUARDADO && prefiereOscuro);
          if (esOscuro) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          console.error("Error al aplicar el tema oscuro:", error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
